<header class="bg-slate-900 text-white px-8 py-5 shadow-md">
  <div class="max-w-7xl mx-auto flex items-center justify-between">

    <!-- Logo -->
    <h1
      class="text-3xl font-bold tracking-tight cursor-pointer"
      routerLink="/">
      Mini E-Commerce
    </h1>

    <nav class="flex gap-3 items-center">

      <!-- IF ORDERS PAGE -->
      @if (isOrderPage) {

        <button
          routerLink="/"
          class="bg-slate-700 hover:bg-slate-600 transition px-5 py-2.5 rounded-xl font-medium">
          ← Back
        </button>

      }

      <!-- IF PRODUCTS PAGE -->
      @else {

        <button
          routerLink="/orders"
          class="bg-white text-slate-800 hover:bg-slate-100 transition px-5 py-2.5 rounded-xl font-medium shadow">
          View Orders
        </button>

      }

    </nav>
  </div>
</header>
